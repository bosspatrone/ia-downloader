<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IA Music">
<title>IA Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- Tab bar on phones, sidebar on wide screens -->
<nav class="tabbar" id="tabbar">
  <div class="brand">IA Music</div>
  <a href="#/library" data-tab="library">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2.5"/><path d="M7 4h12a2 2 0 0 1 2 2v12"/></svg>
    <span>Library</span>
  </a>
  <a href="#/downloads" data-tab="downloads">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"/></svg>
    <span>Downloads</span>
    <b class="tab-badge" id="tab-badge"></b>
  </a>
  <a href="#/search" data-tab="search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
    <span>Search</span>
  </a>
</nav>

<main id="main">

  <!-- Library -->
  <section class="view" id="view-library">
    <header class="navbar">
      <span class="nav-title">Library</span>
      <div class="nav-trailing">
        <button class="icon-btn" id="sort-btn" onclick="openSortSheet()" aria-label="Sort">
          <svg viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5"/></svg>
        </button>
      </div>
    </header>
    <h1 class="large-title">Library</h1>
    <div class="section-sub" id="library-sub"></div>
    <div class="grid" id="library-grid"></div>
    <div class="sentinel" id="library-sentinel"></div>
  </section>

  <!-- Album page -->
  <section class="view" id="view-album">
    <header class="navbar">
      <a class="nav-back" href="#/library" onclick="return goBack()">
        <svg viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></svg><span id="album-back-label">Library</span>
      </a>
      <span class="nav-title" id="album-nav-title"></span>
      <div class="nav-trailing">
        <button class="icon-btn" id="album-more" aria-label="More">
          <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </header>
    <div id="album-body"></div>
  </section>

  <!-- Downloads -->
  <section class="view" id="view-downloads">
    <header class="navbar">
      <span class="nav-title">Downloads</span>
      <div class="nav-trailing">
        <button class="icon-btn accent" onclick="openAddSheet()" aria-label="Add download">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <h1 class="large-title">Downloads</h1>
    <div class="now-card" id="now-card"></div>
    <div class="segmented" id="dl-segments">
      <button data-seg="queue" class="on">Queue <i id="seg-queue"></i></button>
      <button data-seg="failed">Failed <i id="seg-failed"></i></button>
      <button data-seg="removed">Removed <i id="seg-removed"></i></button>
      <button data-seg="hidden">Hidden <i id="seg-hidden"></i></button>
    </div>
    <div class="list-head" id="dl-head"></div>
    <div class="list" id="dl-list"></div>
    <div class="sentinel" id="dl-sentinel"></div>
  </section>

  <!-- Search -->
  <section class="view" id="view-search">
    <header class="navbar">
      <span class="nav-title">Search</span>
    </header>
    <h1 class="large-title">Search</h1>
    <div class="search-field">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
      <input id="search-input" type="search" placeholder="Albums, artists, identifiers" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="search-clear" id="search-clear" aria-label="Clear">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" class="fill"/><path d="m9 9 6 6m0-6-6 6" class="x"/></svg>
      </button>
    </div>
    <div id="search-results"></div>
  </section>

</main>

<!-- Mini-player -->
<div class="mini hidden" id="mini">
  <div class="mini-progress"><div id="mini-progress-fill"></div></div>
  <button class="mini-open" onclick="openNowPlaying()" aria-label="Open Now Playing">
    <span class="mini-art" id="mini-art"></span>
    <span class="mini-text">
      <span class="mini-title" id="mini-title"></span>
      <span class="mini-sub" id="mini-sub"></span>
    </span>
  </button>
  <div class="mini-wide" id="mini-wide">
    <span class="t" id="mini-cur">0:00</span>
    <input type="range" class="scrub" id="mini-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <span class="t" id="mini-dur">0:00</span>
  </div>
  <button class="icon-btn mini-btn" id="mini-prev" onclick="playerPrev()" aria-label="Previous"></button>
  <button class="icon-btn mini-btn" id="mini-play" onclick="playerToggle()" aria-label="Play"></button>
  <button class="icon-btn mini-btn" id="mini-next" onclick="playerNext()" aria-label="Next"></button>
</div>

<!-- Now Playing -->
<div class="np" id="np" aria-hidden="true">
  <div class="np-bg" id="np-bg"></div>
  <div class="np-inner">
    <button class="np-grabber" onclick="closeNowPlaying()" aria-label="Close"><span></span></button>
    <div class="np-art-wrap"><div class="np-art" id="np-art"></div></div>
    <div class="np-queue" id="np-queue"></div>
    <div class="np-meta">
      <div class="np-text">
        <div class="np-title" id="np-title"></div>
        <a class="np-sub" id="np-sub" href="#"></a>
      </div>
    </div>
    <input type="range" class="scrub np-scrub" id="np-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <div class="np-times"><span id="np-cur">0:00</span><span id="np-rem">-0:00</span></div>
    <div class="np-transport">
      <button class="np-tbtn" onclick="playerPrev()" aria-label="Previous" id="np-prev"></button>
      <button class="np-tbtn big" onclick="playerToggle()" aria-label="Play" id="np-play"></button>
      <button class="np-tbtn" onclick="playerNext()" aria-label="Next" id="np-next"></button>
    </div>
    <div class="np-volume" id="np-volume">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill"/></svg>
      <input type="range" class="scrub" id="np-vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </div>
    <div class="np-tools">
      <button class="np-tool" id="np-shuffle" onclick="toggleShuffle()" aria-label="Shuffle"></button>
      <button class="np-tool" id="np-repeat" onclick="cycleRepeat()" aria-label="Repeat"></button>
      <button class="np-tool" id="np-queue-btn" onclick="toggleQueue()" aria-label="Up Next"></button>
    </div>
  </div>
</div>

<!-- Add download sheet -->
<div class="scrim" id="scrim" onclick="closeSheets()"></div>
<div class="sheet" id="add-sheet" role="dialog" aria-label="Add download">
  <div class="sheet-head">
    <button class="text-btn" onclick="closeSheets()">Cancel</button>
    <span class="sheet-title">Add Download</span>
    <button class="text-btn strong" id="add-go" onclick="submitAdd()">Add</button>
  </div>
  <label class="field-label" for="add-url">archive.org item or collection</label>
  <input class="field" id="add-url" type="url" placeholder="https://archive.org/details/…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label class="field-label" for="add-cat">Category</label>
  <select class="field" id="add-cat">
    <option value="Auto" selected>Auto-detect</option>
    <option>Video Game</option><option>Music</option><option>Classical</option>
    <option>Jazz</option><option>Anime</option><option>Sound Effects</option>
  </select>
  <div class="field-note" id="add-note"></div>
</div>

<!-- Action sheet (menus and confirmations) -->
<div class="asheet" id="asheet" role="dialog">
  <div class="asheet-group" id="asheet-group"></div>
  <button class="asheet-cancel" onclick="closeSheets()">Cancel</button>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>
<script src="/static/app.js"></script>
</body>
</html>
